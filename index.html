<script>
  // --- Local storage shim ---
  // The original component was built for Claude.ai's artifact "window.storage" API,
  // which only exists inside claude.ai. This shim reimplements the same
  // get/set/delete/list interface using the browser's localStorage so the app
  // works as a normal standalone PWA.
  (function () {
    const PREFIX = 'patch_storage__';

    function readAll() {
      const out = {};
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(PREFIX)) {
          out[k.slice(PREFIX.length)] = localStorage.getItem(k);
        }
      }
      return out;
    }

    window.storage = {
      async get(key, shared) {
        const raw = localStorage.getItem(PREFIX + key);
        if (raw === null) return null;
        return { key, value: raw, shared: !!shared };
      },
      async set(key, value, shared) {
        localStorage.setItem(PREFIX + key, value);
        return { key, value, shared: !!shared };
      },
      async delete(key, shared) {
        const existed = localStorage.getItem(PREFIX + key) !== null;
        localStorage.removeItem(PREFIX + key);
        return { key, deleted: existed, shared: !!shared };
      },
      async list(prefix, shared) {
        const all = readAll();
        const keys = Object.keys(all).filter(k => !prefix || k.startsWith(prefix));
        return { keys, prefix: prefix || undefined, shared: !!shared };
      }
    };
  })();
</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

#patch-root {
  --bg: #EAEFDF;
  --surface: #F7F9F0;
  --surface-raised: #FFFFFF;
  --ink: #263420;
  --ink-soft: #5B6A52;
  --border: #D7DEC5;
  --clay: #B5651D;
  --clay-ink: #8A4C15;
  --amber: #D79A2C;
  --brick: #A8452E;
  --fresh: #4C7A3D;
  --fresh-bg: #DEEBD3;
  --amber-bg: #F6E7C6;
  --brick-bg: #F1D8CF;
  --radius: 16px;
  --shadow: 0 1px 2px rgba(38,52,32,0.06), 0 4px 16px rgba(38,52,32,0.08);

  font-family: 'Public Sans', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  padding-bottom: 88px;
  -webkit-font-smoothing: antialiased;
}

#patch-root * { box-sizing: border-box; }
#patch-root button { font-family: inherit; }
#patch-root .mono { font-family: 'IBM Plex Mono', monospace; }

/* ---------- Header ---------- */
.p-header {
  padding: 28px 20px 16px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
.p-title {
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 32px;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin: 0;
}
.p-title .dot { color: var(--clay); }
.p-subline {
  font-size: 13px;
  color: var(--ink-soft);
  margin-top: 2px;
}

/* ---------- Tabs ---------- */
.p-tabs {
  display: flex;
  gap: 8px;
  padding: 0 20px 18px;
}
.p-tab {
  border: none;
  background: transparent;
  color: var(--ink-soft);
  font-size: 15px;
  font-weight: 600;
  padding: 8px 4px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
}
.p-tab.active {
  color: var(--ink);
  border-bottom-color: var(--clay);
}

/* ---------- Lists ---------- */
.p-section { padding: 0 20px; }
.p-empty {
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  padding: 32px 20px;
  text-align: center;
  color: var(--ink-soft);
  font-size: 14px;
  line-height: 1.5;
}
.p-empty .big { font-size: 28px; display: block; margin-bottom: 8px; }

.p-cardlist { display: flex; flex-direction: column; gap: 10px; }

.p-card {
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow);
  cursor: pointer;
}

.p-ring-wrap { position: relative; width: 56px; height: 56px; flex-shrink: 0; }
.p-ring-wrap svg { width: 56px; height: 56px; transform: rotate(-90deg); }
.p-ring-bg { fill: none; stroke: var(--border); stroke-width: 4; }
.p-ring-fg { fill: none; stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 0.3s; }
.p-thumb {
  position: absolute; top: 6px; left: 6px; width: 44px; height: 44px;
  border-radius: 50%; overflow: hidden; background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.p-thumb img { width: 100%; height: 100%; object-fit: cover; }

.p-card-body { flex: 1; min-width: 0; }
.p-card-name { font-weight: 600; font-size: 16px; }
.p-card-meta { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
.p-status-pill {
  display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 9px;
  border-radius: 100px; margin-top: 6px; letter-spacing: 0.01em;
}
.p-status-fresh { background: var(--fresh-bg); color: var(--fresh); }
.p-status-due { background: var(--amber-bg); color: var(--clay-ink); }
.p-status-overdue { background: var(--brick-bg); color: var(--brick); }

.p-hist-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface-raised); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px; margin-bottom: 10px;
}
.p-hist-ic { font-size: 20px; flex-shrink: 0; width: 30px; text-align: center; }
.p-hist-body { flex: 1; min-width: 0; }
.p-hist-name { font-weight: 600; font-size: 14.5px; }
.p-hist-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
.p-hist-pending { border-color: var(--brick-bg); background: var(--brick-bg); }
.p-hist-day-label {
  font-size: 11px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase;
  letter-spacing: 0.04em; margin: 18px 0 8px; padding: 0 2px;
}
.p-hist-day-label:first-child { margin-top: 0; }

.p-water-btn {
  border: none; background: var(--ink); color: var(--surface);
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.p-water-btn.due, .p-water-btn.overdue { background: var(--clay); }

/* ---------- FAB ---------- */
.p-fab {
  position: fixed;
  bottom: 92px;
  left: 50%;
  transform: translateX(146px);
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--clay); color: white; border: none;
  font-size: 26px; box-shadow: var(--shadow); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
@media (max-width: 480px) {
  .p-fab { transform: none; right: 20px; left: auto; }
}

/* ---------- Bottom nav ---------- */
.p-nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  background: #DEE6CB;
  border-top: 1px solid #C7D1AD;
  display: flex;
  padding: 10px 20px calc(10px + env(safe-area-inset-bottom));
}
.p-navbtn {
  flex: 1; background: none; border: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--ink-soft); font-size: 11px; font-weight: 600;
}
.p-navbtn.active { color: var(--clay-ink); }
.p-navbtn .ic { font-size: 19px; }

/* ---------- Overlay / detail / modal ---------- */
.p-overlay {
  position: fixed; inset: 0; background: var(--bg);
  max-width: 480px; margin: 0 auto;
  overflow-y: auto; z-index: 20;
}
.p-ov-header {
  display: flex; align-items: center; gap: 12px;
  padding: 18px 16px; position: sticky; top: 0;
  background: var(--bg); z-index: 2;
}
.p-back {
  border: none; background: var(--surface-raised); border: 1px solid var(--border);
  width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
}
.p-ov-title { font-family: 'Fraunces', serif; font-weight: 700; font-size: 20px; flex: 1; }
.p-edit-btn {
  border: none; background: var(--surface-raised); border: 1px solid var(--border);
  width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.p-description {
  margin: 0 16px 14px; font-size: 14px; line-height: 1.5; color: var(--ink-soft);
  cursor: pointer; white-space: pre-wrap;
}
.p-description.empty { font-style: italic; color: var(--ink-soft); opacity: 0.75; }

.p-hero-photo {
  margin: 0 16px 14px; border-radius: var(--radius); overflow: hidden;
  height: 200px; background: var(--surface); display: flex; align-items: center; justify-content: center;
  font-size: 44px; color: var(--ink-soft);
}
.p-hero-photo img { width: 100%; height: 100%; object-fit: cover; }

.p-detail-stats {
  display: flex; gap: 10px; padding: 0 16px 16px;
}
.p-stat {
  flex: 1; background: var(--surface-raised); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 12px;
}
.p-stat-label { font-size: 11px; color: var(--ink-soft); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
.p-stat-value { font-size: 15px; font-weight: 600; margin-top: 2px; }

.p-big-water {
  margin: 0 16px 20px; width: calc(100% - 32px);
  background: var(--clay); color: white; border: none;
  padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
}

.p-notes-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 16px 10px; margin-top: 6px;
}
.p-notes-head h3 { font-family: 'Fraunces', serif; font-size: 17px; margin: 0; }
.p-addnote-btn {
  border: none; background: var(--surface-raised); border: 1px solid var(--border);
  padding: 6px 12px; border-radius: 100px; font-size: 13px; font-weight: 600; cursor: pointer;
}
.p-note {
  margin: 0 16px 10px; background: var(--surface-raised); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px; display: flex; gap: 10px;
}
.p-note-photo { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
.p-note-date { font-size: 11px; color: var(--ink-soft); margin-bottom: 3px; }
.p-note-text { font-size: 14px; line-height: 1.4; white-space: pre-wrap; }

.p-delete-row { padding: 24px 16px 40px; }
.p-delete-btn { background: none; border: none; color: var(--brick); font-size: 13px; font-weight: 600; cursor: pointer; }

/* ---------- Modal (add plant / add note) ---------- */
.p-modal-bg {
  position: fixed; inset: 0; background: rgba(38,52,32,0.35);
  max-width: 480px; margin: 0 auto; z-index: 30;
  display: flex; align-items: flex-end;
}
.p-modal {
  background: var(--surface-raised); width: 100%;
  border-radius: 20px 20px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
  max-height: 88vh; overflow-y: auto;
}
.p-modal h2 { font-family: 'Fraunces', serif; font-size: 20px; margin: 0 0 16px; }
.p-field { margin-bottom: 14px; }
.p-field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
.p-field input[type=text], .p-field input[type=number], .p-field textarea {
  width: 100%; border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; font-size: 15px; font-family: inherit; background: var(--surface);
  color: var(--ink);
}
.p-field textarea { resize: vertical; min-height: 64px; }
.p-freq-row { display: flex; align-items: center; gap: 8px; }
.p-freq-row input { width: 70px; flex: none; }
.p-photo-upload {
  border: 1px dashed var(--border); border-radius: 12px; padding: 14px;
  text-align: center; font-size: 13px; color: var(--ink-soft); cursor: pointer;
  position: relative; overflow: hidden;
}
.p-photo-upload img { max-height: 100px; border-radius: 8px; margin-top: 8px; }
.p-photo-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.p-modal-actions { display: flex; gap: 10px; margin-top: 6px; }
.p-btn-secondary {
  flex: 1; background: none; border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--ink);
}
.p-btn-primary {
  flex: 2; background: var(--clay); border: none; border-radius: 10px;
  padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; color: white;
}
.p-btn-primary:disabled { opacity: 0.5; }

.p-toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--surface); padding: 9px 16px;
  border-radius: 100px; font-size: 13px; z-index: 40; opacity: 0; pointer-events: none;
  transition: opacity 0.25s;
}
.p-toast.show { opacity: 1; }
</style>

<div id="patch-root">
  <div id="patch-main"></div>
  <button class="p-fab" data-action="open-add-plant">+</button>
  <div class="p-nav">
    <button class="p-navbtn" data-action="go-today" id="nav-today">
      <span class="ic">&#128167;</span>Today
    </button>
    <button class="p-navbtn" data-action="go-garden" id="nav-garden">
      <span class="ic">&#127807;</span>Garden
    </button>
    <button class="p-navbtn" data-action="go-history" id="nav-history">
      <span class="ic">&#128340;</span>History
    </button>
  </div>
  <div class="p-toast" id="patch-toast"></div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'patch-plants-v1';
  const root = document.getElementById('patch-root');
  const mainEl = document.getElementById('patch-main');
  const toastEl = document.getElementById('patch-toast');

  let state = {
    plants: [],
    log: [],
    view: 'today',       // 'today' | 'garden' | 'history'
    detailId: null,       // plant id when viewing detail
    modal: null,          // 'add-plant' | 'add-note'
    pendingPhoto: null,
    loaded: false
  };

  const PLACEHOLDER_EMOJI = ['\u{1F955}','\u{1F345}','\u{1F336}\uFE0F','\u{1F952}','\u{1F33F}','\u{1F966}','\u{1F33E}'];
  function emojiFor(id){
    let h = 0;
    for (const c of id) h = (h*31 + c.charCodeAt(0)) % 997;
    return PLACEHOLDER_EMOJI[h % PLACEHOLDER_EMOJI.length];
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function daysBetween(a,b){
    const d1 = new Date(a+'T00:00:00'), d2 = new Date(b+'T00:00:00');
    return Math.round((d2-d1)/86400000);
  }
  function fmtDate(iso){
    const d = new Date(iso+'T00:00:00');
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  }

  function nextDueISO(p){
    const d = new Date(p.lastWatered+'T00:00:00');
    d.setDate(d.getDate()+p.frequency);
    return d.toISOString().slice(0,10);
  }
  function statusOf(p){
    const days = daysBetween(nextDueISO(p), todayISO());
    if (days > 0) return 'overdue';
    if (days === 0) return 'due';
    return 'fresh';
  }
  function ringPercent(p){
    const elapsed = daysBetween(p.lastWatered, todayISO());
    return Math.max(0, Math.min(1, elapsed / p.frequency));
  }
  function ringColor(status){
    if (status === 'overdue') return 'var(--brick)';
    if (status === 'due') return 'var(--amber)';
    return 'var(--fresh)';
  }

  async function loadState(){
    try {
      const res = await window.storage.get(STORAGE_KEY, false);
      const parsed = res && res.value ? JSON.parse(res.value) : null;
      if (Array.isArray(parsed)){
        state.plants = parsed; state.log = [];
      } else if (parsed){
        state.plants = parsed.plants || []; state.log = parsed.log || [];
      } else {
        state.plants = []; state.log = [];
      }
    } catch(e) {
      state.plants = []; state.log = [];
    }
    state.loaded = true;
    render();
  }
  async function savePlants(){
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify({plants: state.plants, log: state.log}), false);
    } catch(e) {
      showToast("Couldn't save — try again");
    }
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=>toastEl.classList.remove('show'), 1800);
  }

  function resizeImage(file, maxDim){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
          else if (h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /* ---------------- RENDER ---------------- */
  function render(){
    if (!state.loaded){
      mainEl.innerHTML = '<div class="p-header"><h1 class="p-title">Patch<span class="dot">.</span></h1></div>';
      return;
    }
    document.getElementById('nav-today').classList.toggle('active', state.view==='today' && !state.detailId);
    document.getElementById('nav-garden').classList.toggle('active', state.view==='garden' && !state.detailId);
    document.getElementById('nav-history').classList.toggle('active', state.view==='history' && !state.detailId);

    let html = '';
    if (state.view === 'today') html = renderToday();
    else if (state.view === 'garden') html = renderGarden();
    else html = renderHistory();
    mainEl.innerHTML = html;

    if (state.detailId){
      renderDetailOverlay();
    }
    if (state.modal === 'add-plant'){
      renderAddPlantModal();
    }
    if (state.modal === 'add-note'){
      renderAddNoteModal();
    }
    if (state.modal === 'edit-plant'){
      renderEditPlantModal();
    }
  }

  function renderToday(){
    const due = state.plants.filter(p => statusOf(p) !== 'fresh')
      .sort((a,b)=> daysBetween(nextDueISO(b),todayISO()) - daysBetween(nextDueISO(a),todayISO()));
    let head = '<div class="p-header"><h1 class="p-title">Patch<span class="dot">.</span></h1>'
      + '<div class="p-subline">' + new Date().toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'}) + '</div></div>';

    if (state.plants.length === 0){
      return head + '<div class="p-section"><div class="p-empty"><span class="big">&#127793;</span>Your patch is empty.<br>Tap + to add your first plant.</div></div>';
    }
    if (due.length === 0){
      return head + '<div class="p-section"><div class="p-empty"><span class="big">&#9989;</span>Everything\'s watered.<br>Nothing needs you today.</div></div>';
    }
    return head + '<div class="p-section"><div class="p-cardlist">' + due.map(p=>plantCard(p)).join('') + '</div></div>';
  }

  function renderGarden(){
    let head = '<div class="p-header"><h1 class="p-title">Garden<span class="dot">.</span></h1>'
      + '<div class="p-subline">' + state.plants.length + ' plant' + (state.plants.length===1?'':'s') + '</div></div>';
    if (state.plants.length === 0){
      return head + '<div class="p-section"><div class="p-empty"><span class="big">&#127793;</span>Nothing planted yet.<br>Tap + to add your first plant.</div></div>';
    }
    const sorted = [...state.plants].sort((a,b)=> a.name.localeCompare(b.name));
    return head + '<div class="p-section"><div class="p-cardlist">' + sorted.map(p=>plantCard(p)).join('') + '</div></div>';
  }

  function renderHistory(){
    let head = '<div class="p-header"><h1 class="p-title">History<span class="dot">.</span></h1>'
      + '<div class="p-subline">Missed and past waterings</div></div>';

    if (state.plants.length === 0 && state.log.length === 0){
      return head + '<div class="p-section"><div class="p-empty"><span class="big">&#128340;</span>Nothing logged yet.<br>Your watering history will show up here.</div></div>';
    }

    const missing = state.plants.filter(p => statusOf(p) === 'overdue');
    let html = head + '<div class="p-section">';

    if (missing.length){
      html += '<div class="p-hist-day-label">Currently missed</div>';
      missing.forEach(p=>{
        const days = daysBetween(nextDueISO(p), todayISO());
        html += '<div class="p-hist-item p-hist-pending" data-action="open-detail" data-id="'+p.id+'">'
          + '<div class="p-hist-ic">&#9888;&#65039;</div>'
          + '<div class="p-hist-body"><div class="p-hist-name">'+escapeHtml(p.name)+'</div>'
          + '<div class="p-hist-sub">Overdue by '+days+' day'+(days===1?'':'s')+' — still needs water</div></div>'
          + '<button class="p-water-btn overdue" data-action="water-plant" data-id="'+p.id+'" title="Mark watered">&#128167;</button>'
          + '</div>';
      });
    }

    if (state.log.length){
      html += '<div class="p-hist-day-label">Watering log</div>';
      state.log.forEach(entry=>{
        const wasLate = entry.lateDays > 0;
        html += '<div class="p-hist-item">'
          + '<div class="p-hist-ic">'+(wasLate ? '&#128308;' : '&#9989;')+'</div>'
          + '<div class="p-hist-body"><div class="p-hist-name">'+escapeHtml(entry.plantName)+'</div>'
          + '<div class="p-hist-sub">'+fmtDate(entry.date)+' — '+(wasLate ? ('watered '+entry.lateDays+' day'+(entry.lateDays===1?'':'s')+' late') : 'watered on time')+'</div></div>'
          + '</div>';
      });
    } else if (!missing.length){
      html += '<div class="p-empty">No waterings logged yet.</div>';
    }

    html += '</div>';
    return html;
  }

  function plantCard(p){
    const status = statusOf(p);
    const pct = ringPercent(p);
    const r = 26, circ = 2*Math.PI*r;
    const offset = circ * (1-pct);
    const statusLabel = status==='overdue' ? 'Overdue' : status==='due' ? 'Due today' : 'Watered';
    const daysLeft = daysBetween(todayISO(), nextDueISO(p));
    const metaText = status==='fresh' ? ('next in ' + daysLeft + 'd') : (status==='due' ? 'water today' : ('overdue by ' + Math.abs(daysBetween(nextDueISO(p),todayISO())) + 'd'));
    return '<div class="p-card" data-action="open-detail" data-id="'+p.id+'">'
      + '<div class="p-ring-wrap">'
        + '<svg viewBox="0 0 56 56"><circle class="p-ring-bg" cx="28" cy="28" r="'+r+'"/>'
        + '<circle class="p-ring-fg" cx="28" cy="28" r="'+r+'" stroke="'+ringColor(status)+'" stroke-dasharray="'+circ+'" stroke-dashoffset="'+offset+'"/></svg>'
        + '<div class="p-thumb">' + (p.photo ? '<img src="'+p.photo+'">' : emojiFor(p.id)) + '</div>'
      + '</div>'
      + '<div class="p-card-body">'
        + '<div class="p-card-name">'+escapeHtml(p.name)+'</div>'
        + '<div class="p-card-meta">'+metaText+'</div>'
        + '<span class="p-status-pill p-status-'+status+'">'+statusLabel+'</span>'
      + '</div>'
      + '<button class="p-water-btn '+status+'" data-action="water-plant" data-id="'+p.id+'" title="Mark watered">&#128167;</button>'
      + '</div>';
  }

  function renderDetailOverlay(){
    const p = state.plants.find(x=>x.id===state.detailId);
    if (!p){ state.detailId = null; return; }
    const status = statusOf(p);
    const notes = [...(p.notes||[])].sort((a,b)=> b.date.localeCompare(a.date));
    const div = document.createElement('div');
    div.className = 'p-overlay';
    const hasDesc = p.description && p.description.trim();
    div.innerHTML = '<div class="p-ov-header"><button class="p-back" data-action="close-detail">&#8592;</button><div class="p-ov-title">'+escapeHtml(p.name)+'</div><button class="p-edit-btn" data-action="open-edit-plant" data-id="'+p.id+'" title="Edit">&#9998;</button></div>'
      + '<div class="p-hero-photo">'+(p.photo ? '<img src="'+p.photo+'">' : emojiFor(p.id))+'</div>'
      + '<div class="p-description'+(hasDesc?'':' empty')+'" data-action="open-edit-plant" data-id="'+p.id+'">'
        + (hasDesc ? escapeHtml(p.description) : 'No description yet — tap to add growing notes, guides, or care tips.')
      + '</div>'
      + '<div class="p-detail-stats">'
        + '<div class="p-stat"><div class="p-stat-label">Last watered</div><div class="p-stat-value">'+fmtDate(p.lastWatered)+'</div></div>'
        + '<div class="p-stat"><div class="p-stat-label">Every</div><div class="p-stat-value">'+p.frequency+' day'+(p.frequency===1?'':'s')+'</div></div>'
      + '</div>'
      + '<button class="p-big-water" data-action="water-plant" data-id="'+p.id+'">'+(status==='fresh' ? 'Water early' : 'Mark watered today')+'</button>'
      + '<div class="p-notes-head"><h3>Notes &amp; photos</h3><button class="p-addnote-btn" data-action="open-add-note">+ Add</button></div>'
      + (notes.length===0 ? '<div class="p-section"><div class="p-empty">No notes yet. Log growth, pests, or anything worth remembering.</div></div>' : notes.map(n=>
          '<div class="p-note">'
          + (n.photo ? '<img class="p-note-photo" src="'+n.photo+'">' : '')
          + '<div><div class="p-note-date">'+fmtDate(n.date)+'</div><div class="p-note-text">'+escapeHtml(n.text||'')+'</div></div>'
          + '</div>').join(''))
      + '<div class="p-delete-row"><button class="p-delete-btn" data-action="delete-plant" data-id="'+p.id+'">Remove this plant</button></div>';
    root.appendChild(div);
  }

  function renderAddPlantModal(){
    const div = document.createElement('div');
    div.className = 'p-modal-bg';
    div.setAttribute('data-action-bg','close-modal');
    div.innerHTML = '<div class="p-modal">'
      + '<h2>Add a plant</h2>'
      + '<div class="p-field"><label>Name</label><input type="text" id="f-name" placeholder="e.g. Cherry tomatoes" autofocus></div>'
      + '<div class="p-field"><label>Water every</label><div class="p-freq-row"><input type="number" id="f-freq" value="3" min="1" max="60"> <span>days</span></div></div>'
      + '<div class="p-field"><label>Photo (optional)</label>'
        + '<div class="p-photo-upload" id="f-photo-wrap">Tap to add a photo<input type="file" accept="image/*" id="f-photo"></div>'
      + '</div>'
      + '<div class="p-field"><label>Description (optional)</label><textarea id="f-desc" placeholder="Care guide, sunlight needs, spacing, variety details..."></textarea></div>'
      + '<div class="p-field"><label>Starting note (optional)</label><textarea id="f-note" placeholder="Planted from seed, sunny spot..."></textarea></div>'
      + '<div class="p-modal-actions">'
        + '<button class="p-btn-secondary" data-action="close-modal">Cancel</button>'
        + '<button class="p-btn-primary" data-action="save-plant">Add to garden</button>'
      + '</div>'
    + '</div>';
    root.appendChild(div);

    document.getElementById('f-photo').addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if (!file) return;
      const dataUrl = await resizeImage(file, 500);
      state.pendingPhoto = dataUrl;
      document.getElementById('f-photo-wrap').innerHTML = '<img src="'+dataUrl+'"><input type="file" accept="image/*" id="f-photo">';
      document.getElementById('f-photo').addEventListener('change', arguments.callee);
    });
  }

  function renderAddNoteModal(){
    const div = document.createElement('div');
    div.className = 'p-modal-bg';
    div.setAttribute('data-action-bg','close-modal');
    div.innerHTML = '<div class="p-modal">'
      + '<h2>Add a note</h2>'
      + '<div class="p-field"><label>What\'s going on</label><textarea id="n-text" placeholder="New leaves showing, spotted aphids, first fruit..." autofocus></textarea></div>'
      + '<div class="p-field"><label>Photo (optional)</label>'
        + '<div class="p-photo-upload" id="n-photo-wrap">Tap to add a photo<input type="file" accept="image/*" id="n-photo"></div>'
      + '</div>'
      + '<div class="p-modal-actions">'
        + '<button class="p-btn-secondary" data-action="close-modal">Cancel</button>'
        + '<button class="p-btn-primary" data-action="save-note">Save note</button>'
      + '</div>'
    + '</div>';
    root.appendChild(div);

    document.getElementById('n-photo').addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if (!file) return;
      const dataUrl = await resizeImage(file, 500);
      state.pendingPhoto = dataUrl;
      document.getElementById('n-photo-wrap').innerHTML = '<img src="'+dataUrl+'"><input type="file" accept="image/*" id="n-photo">';
    });
  }

  function renderEditPlantModal(){
    const p = state.plants.find(x=>x.id===state.detailId);
    if (!p) return;
    const div = document.createElement('div');
    div.className = 'p-modal-bg';
    div.setAttribute('data-action-bg','close-modal');
    div.innerHTML = '<div class="p-modal">'
      + '<h2>Edit plant</h2>'
      + '<div class="p-field"><label>Name</label><input type="text" id="e-name" value="'+escapeHtml(p.name)+'" autofocus></div>'
      + '<div class="p-field"><label>Water every</label><div class="p-freq-row"><input type="number" id="e-freq" value="'+p.frequency+'" min="1" max="60"> <span>days</span></div></div>'
      + '<div class="p-field"><label>Description (optional)</label><textarea id="e-desc" placeholder="Care guide, sunlight needs, spacing, variety details...">'+escapeHtml(p.description||'')+'</textarea></div>'
      + '<div class="p-modal-actions">'
        + '<button class="p-btn-secondary" data-action="close-modal">Cancel</button>'
        + '<button class="p-btn-primary" data-action="save-edit-plant" data-id="'+p.id+'">Save changes</button>'
      + '</div>'
    + '</div>';
    root.appendChild(div);
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ---------------- ACTIONS ---------------- */
  root.addEventListener('click', async (e)=>{
    const bgTarget = e.target.closest('[data-action-bg]');
    if (bgTarget && e.target === bgTarget){
      state.modal = null; state.pendingPhoto = null; render(); return;
    }
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.getAttribute('data-action');
    const id = el.getAttribute('data-id');

    if (action === 'go-today'){ state.view='today'; state.detailId=null; render(); }
    else if (action === 'go-garden'){ state.view='garden'; state.detailId=null; render(); }
    else if (action === 'go-history'){ state.view='history'; state.detailId=null; render(); }
    else if (action === 'open-detail'){ state.detailId = id; render(); }
    else if (action === 'close-detail'){ state.detailId = null; render(); }
    else if (action === 'open-add-plant'){ state.modal = 'add-plant'; state.pendingPhoto=null; render(); }
    else if (action === 'open-add-note'){ state.modal = 'add-note'; state.pendingPhoto=null; render(); }
    else if (action === 'open-edit-plant'){ state.detailId = id; state.modal = 'edit-plant'; render(); }
    else if (action === 'close-modal'){ state.modal = null; state.pendingPhoto=null; render(); }
    else if (action === 'water-plant'){
      const p = state.plants.find(x=>x.id===id);
      if (p){
        const daysLate = Math.max(0, daysBetween(nextDueISO(p), todayISO()));
        state.log.unshift({id: uid(), plantId: p.id, plantName: p.name, date: todayISO(), lateDays: daysLate});
        p.lastWatered = todayISO();
        await savePlants();
        showToast(p.name + ' watered');
        render();
      }
    }
    else if (action === 'delete-plant'){
      if (confirm('Remove this plant from your garden? This can\'t be undone.')){
        state.plants = state.plants.filter(x=>x.id!==id);
        state.detailId = null;
        await savePlants();
        render();
      }
    }
    else if (action === 'save-plant'){
      const name = document.getElementById('f-name').value.trim();
      if (!name){ showToast('Give it a name first'); return; }
      const freq = Math.max(1, parseInt(document.getElementById('f-freq').value,10) || 3);
      const note = document.getElementById('f-note').value.trim();
      const description = document.getElementById('f-desc').value.trim();
      const newPlant = {
        id: uid(), name, frequency: freq, description: description || '',
        lastWatered: todayISO(), photo: state.pendingPhoto || null,
        notes: note ? [{date: todayISO(), text: note, photo: null}] : []
      };
      state.plants.push(newPlant);
      state.modal = null; state.pendingPhoto = null;
      await savePlants();
      showToast(name + ' added to your patch');
      render();
    }
    else if (action === 'save-edit-plant'){
      const p = state.plants.find(x=>x.id===id);
      if (!p) return;
      const name = document.getElementById('e-name').value.trim();
      if (!name){ showToast('Give it a name first'); return; }
      const freq = Math.max(1, parseInt(document.getElementById('e-freq').value,10) || p.frequency);
      const description = document.getElementById('e-desc').value.trim();
      p.name = name; p.frequency = freq; p.description = description;
      state.modal = null;
      await savePlants();
      showToast('Changes saved');
      render();
    }
    else if (action === 'save-note'){
      const text = document.getElementById('n-text').value.trim();
      if (!text && !state.pendingPhoto){ showToast('Add a note or a photo'); return; }
      const p = state.plants.find(x=>x.id===state.detailId);
      if (p){
        p.notes = p.notes || [];
        p.notes.push({date: todayISO(), text, photo: state.pendingPhoto || null});
        state.modal = null; state.pendingPhoto = null;
        await savePlants();
        render();
      }
    }
  });

  loadState();
})();
</script>


<script>
  // Register service worker for offline support / installability
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => {
        console.warn('Service worker registration failed:', err);
      });
    });
  }
</script>
